# Temporary reference for the three-camera 3D MVP.
# Distances and speeds are normalized by the 3D shoulder width.
# +X: person's right, +Y: up, +Z: from the person toward the front RealSense.
# Replace the profile targets with statistics from recorded correct punches.

detector:
  # Speed is only one start signal. A slow punch can start through the
  # accumulated displacement + elbow-extension condition below.
  # Guard acquisition uses the front RealSense 2D MediaPipe pose. Punch motion
  # after READY still uses the reconstructed three-camera 3D coordinates.
  guard_speed: 0.45
  guard_min_visibility: 0.30
  start_speed: 0.25
  end_speed: 0.12
  # End only when both speed and frame-to-frame movement are small, so a
  # deliberately slow punch is not cut off while it is still advancing.
  end_step_displacement_ratio: 0.015
  speed_window: 3
  start_displacement_ratio: 0.10
  start_extension_deg: 8.0
  slow_start_displacement_ratio: 0.22
  slow_start_speed: 0.05
  slow_start_extension_deg: 12.0
  start_confirm_frames: 2
  guard_max_wrist_face_ratio: 2.60
  max_lost_frames: 6
  ready_frames: 3
  end_frames: 4
  min_duration_s: 0.20
  max_duration_s: 3.00
  cooldown_s: 0.70
  min_confidence: 0.18

classification:
  # Use the first near-peak outbound frame and ignore recovery to guard.
  impact_peak_fraction: 0.92

  # Straight: forward-dominant, direct path, low curve, elbow extension.
  straight_forward_ratio_min: 0.42
  straight_linearity_min: 0.84
  straight_curvature_max: 0.22
  straight_elbow_angle_min: 138.0
  straight_extension_gain_min: 8.0

  # Hook: lateral component and 3D arc must both be present; arm remains bent.
  hook_lateral_ratio_min: 0.42
  hook_curvature_min: 0.16
  hook_elbow_angle_max: 158.0
  hook_outward_travel_min: 0.12
  hook_inward_return_min: 0.08

  # Uppercut: upward travel dominates lateral travel; arm remains bent.
  uppercut_upward_ratio_min: 0.42
  uppercut_upward_travel_min: 0.18
  uppercut_elbow_angle_max: 158.0

feedback:
  score_threshold: 30.0
  joint_error_threshold: 1.0
  save_score_threshold: 30.0
  pass_score_threshold: 30.0

profiles:
  straight:
    features:
      strike_elbow_angle_deg:
        target: 165.0
        tolerance: 24.0
        weight: 0.25
        joint: strike_elbow
        code: elbow_not_extended
      forward_component_ratio:
        target: 0.90
        tolerance: 0.38
        weight: 0.25
        joint: strike_wrist
        code: straight_forward_path_off
      path_linearity:
        target: 0.97
        tolerance: 0.16
        weight: 0.20
        joint: strike_wrist
        code: straight_path_not_linear
      guard_to_face_ratio:
        target: 0.45
        tolerance: 0.45
        weight: 0.20
        joint: guard_wrist
        code: guard_dropped
      strike_wrist_height_ratio:
        target: 0.05
        tolerance: 0.40
        weight: 0.10
        joint: strike_wrist
        code: wrist_height_off

  hook:
    features:
      strike_elbow_angle_deg:
        target: 105.0
        tolerance: 32.0
        weight: 0.25
        joint: strike_elbow
        code: hook_elbow_angle_off
      lateral_component_ratio:
        target: 0.75
        tolerance: 0.38
        weight: 0.25
        joint: strike_wrist
        code: hook_lateral_path_off
      path_curvature_ratio:
        target: 0.28
        tolerance: 0.22
        weight: 0.20
        joint: strike_wrist
        code: hook_curve_off
      hook_inward_return_ratio:
        target: 0.35
        tolerance: 0.25
        weight: 0.10
        joint: strike_wrist
        code: hook_lateral_path_off
      wrist_elbow_height_ratio:
        target: 0.00
        tolerance: 0.30
        weight: 0.10
        joint: strike_wrist
        code: hook_wrist_elbow_misaligned
      guard_to_face_ratio:
        target: 0.45
        tolerance: 0.45
        weight: 0.10
        joint: guard_wrist
        code: guard_dropped

  uppercut:
    features:
      strike_elbow_angle_deg:
        target: 100.0
        tolerance: 35.0
        weight: 0.25
        joint: strike_elbow
        code: uppercut_elbow_angle_off
      upward_component_ratio:
        target: 0.82
        tolerance: 0.38
        weight: 0.25
        joint: strike_wrist
        code: uppercut_upward_path_off
      upward_travel_ratio:
        target: 0.60
        tolerance: 0.38
        weight: 0.20
        joint: strike_wrist
        code: uppercut_upward_path_off
      wrist_elbow_height_ratio:
        target: 0.25
        tolerance: 0.35
        weight: 0.10
        joint: strike_wrist
        code: uppercut_height_off
      guard_to_face_ratio:
        target: 0.45
        tolerance: 0.45
        weight: 0.20
        joint: guard_wrist
        code: guard_dropped
